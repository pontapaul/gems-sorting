<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GemsSorting</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script src="/sortable.min.js" defer></script>
<script src="/i18n.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body>

<svg class="sprites" width="0" height="0" aria-hidden="true">
  <symbol id="github-mark" viewBox="0 0 16 16"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></symbol>
</svg>

<div id="loading" class="screen"><div class="spinner" aria-label="…"></div></div>

<div id="login" class="screen" hidden>
  <div class="login-card">
    <img src="/favicon.svg" width="56" height="56" alt="">
    <h1>GemsSorting</h1>
    <p id="login-expired" class="login-warn" data-i18n="login.expired" hidden></p>
    <p data-i18n="login.type"></p>
    <p><code class="big">/gems web</code></p>
    <p class="muted" data-i18n="login.then"></p>
    <div class="login-foot">
      <select class="lang-select" data-i18n-aria="lang.label">
        <option value="en">English</option>
        <option value="it">Italiano</option>
      </select>
      <a class="github" href="https://github.com/pontapaul/gems-sorting" target="_blank" rel="noopener" data-i18n-title="github.title">
        <svg width="16" height="16" aria-hidden="true"><use href="#github-mark"/></svg> GitHub
      </a>
    </div>
  </div>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="brand">
      <img src="/favicon.svg" width="28" height="28" alt="">
      <div>
        <strong>GemsSorting</strong>
        <span class="muted" data-i18n="brand.sub"></span>
      </div>
    </div>
    <div class="topbar-right">
      <label class="lang" data-i18n-title="lang.title">
        <span data-i18n="lang.label"></span>
        <select class="lang-select" data-i18n-aria="lang.label">
          <option value="en">English</option>
          <option value="it">Italiano</option>
        </select>
      </label>
      <span id="save-status" class="save-status" data-state="saved" role="status" aria-live="polite"></span>
      <button id="undo" class="btn ghost" type="button" disabled data-i18n="undo" data-i18n-title="undo.title"></button>
      <span id="me" class="me"></span>
      <button id="logout" class="btn ghost" type="button" data-i18n="logout"></button>
      <a class="github icon-link" href="https://github.com/pontapaul/gems-sorting" target="_blank" rel="noopener" data-i18n-title="github.title" data-i18n-aria="github.title">
        <svg width="20" height="20" aria-hidden="true"><use href="#github-mark"/></svg>
      </a>
    </div>
  </header>

  <details id="help" class="help" open>
    <summary data-i18n="help.summary"></summary>
    <ol>
      <li data-i18n-html="help.1"></li>
      <li data-i18n-html="help.2"></li>
      <li data-i18n-html="help.3"></li>
    </ol>
    <p class="muted" data-i18n-html="help.note"></p>
  </details>

  <main class="layout">
    <section class="panel catalog" data-i18n-aria="items.title">
      <div class="panel-head">
        <h2 data-i18n="items.title"></h2>
        <span id="catalog-count" class="muted"></span>
      </div>
      <div class="search">
        <input id="search" type="search" autocomplete="off" spellcheck="false"
               data-i18n-placeholder="search.placeholder" data-i18n-aria="search.aria">
      </div>
      <div class="filters" role="radiogroup" data-i18n-aria="filter.aria">
        <button type="button" class="chip-btn" data-filter="all" aria-pressed="true" data-i18n="filter.all"></button>
        <button type="button" class="chip-btn" data-filter="free" aria-pressed="false" data-i18n="filter.free"></button>
        <button type="button" class="chip-btn" data-filter="grouped" aria-pressed="false" data-i18n="filter.grouped"></button>
      </div>
      <label class="target">
        <span data-i18n="target.label"></span>
        <select id="target" data-i18n-aria="target.aria"></select>
      </label>
      <div id="bulk" class="bulk" hidden>
        <button id="bulk-add" type="button" class="btn primary small"></button>
        <span id="bulk-note" class="muted"></span>
      </div>
      <p id="catalog-notice" class="notice" data-i18n="catalog.preparing" hidden></p>
      <ul id="catalog" class="tiles" data-i18n-aria="catalog.aria"></ul>
      <p id="catalog-empty" class="empty" data-i18n="catalog.empty" hidden></p>
    </section>

    <section class="panel groups-panel" data-i18n-aria="groups.title">
      <div class="panel-head">
        <h2 data-i18n="groups.title"></h2>
        <button id="new-group" type="button" class="btn primary" data-i18n="groups.new"></button>
      </div>
      <div class="group-search">
        <input id="group-search" type="search" autocomplete="off" spellcheck="false"
               data-i18n-placeholder="groups.search" data-i18n-aria="groups.search">
        <span id="groups-count" class="muted"></span>
      </div>
      <p id="groups-none" class="empty" data-i18n="groups.none" hidden></p>
      <div id="groups" class="groups"></div>
      <div id="groups-empty" class="empty big-empty" hidden>
        <p><b data-i18n="groups.empty.title"></b></p>
        <p class="muted" data-i18n-html="groups.empty.text"></p>
        <button id="new-group-empty" type="button" class="btn primary" data-i18n="groups.empty.button"></button>
      </div>
    </section>
  </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden>
  <span id="toast-text"></span>
  <button id="toast-action" type="button" class="btn ghost small" hidden></button>
</div>

</body>
</html>
